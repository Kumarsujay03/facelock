# Face unlock settings. Changes apply at the next scan (no restart needed).

[camera]
# auto picks the built-in colour camera; or give a device such as /dev/video0
device = auto

[match]
# Two face models must both recognise you, over several frames in a row,
# all showing the same person. Similarities are 0-1.
#
# AuraFace, the deciding model. On the LFW benchmark (14,280 owner/intruder
# pairs) no stranger's 5-frame median passed 0.34; a look-alike brother
# reached 0.55. Enrolment sets your own bar from how closely your face
# matches itself. Nobody's bar is below 0.62: these settings can raise the
# bars, never lower them below that.
strong_accept = 0.62
strong_frames = 5
# no frame of those may be more than this below the bar
strong_spread = 0.10
# every pair of those frames must be this similar (one person, not two)
strong_same_person = 0.45
strong_learned_floor = 0.45
# only frames this close (AuraFace) to your enrolment are learned
learn_strong = 0.75
#
# SFace, the first check. A look-alike brother reached 0.54 with it.
accept = 0.58
sface_gate = 0.45
learned_floor = 0.50
learn_from = 0.68
max_learned = 40
# faces this close to an "other" person (facelock add-other) are refused
other_margin = 0.03

[unlock]
# longest the camera stays on per wake (seconds)
scan_seconds = 8
# a face that doesn't match for this long is one failed attempt
attempt_seconds = 2.5
# after this many failed tries face unlock pauses for pause_seconds (someone
# else may have tried); if this many more fail, until you unlock with your
# fingerprint or password
max_failures = 3
pause_seconds = 30
# ignore faces smaller than this many pixels (too far away)
min_face_px = 90

[liveness]
# The blink check tells a live person from a photo. It is still being tested,
# so by default it only watches:
# observe: unlocks on your face alone and records what the blink check saw
#   (see "sudo facelock stats"; reports from different laptops help tune it);
# blink: you must blink before it unlocks (a photo can't); off: no blink check
liveness = observe

[lowlight]
# in a dark room the screen turns white at full brightness for a few seconds
lowlight = true
# average camera brightness (0-255) below which that happens
dark_luma = 55
# it first tries this many seconds in the room's own light; the lock screen
# lights up at most once until the screen has been off
light_after = 1.5

[update]
# a new release is looked for once a day; "sudo facelock update" installs it.
# auto = true installs it on its own (you then log out and in once to load
# the new lock screen extension)
auto = false
